name: melife

# Local development only. Production uses a managed PostgreSQL connection.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: melife
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: melife
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melife -d melife"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: melife
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: melife_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melife -d melife_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
